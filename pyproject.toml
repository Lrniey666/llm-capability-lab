[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-capability-lab"
dynamic = ["version"]
description = "跨供應商的 LLM 能力驗證與故障轉移路由：探針、配額、輪換呼叫，以及一套可重現的視覺抽取評測"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Lrniey666" },
]
keywords = ["llm", "benchmark", "evaluation", "failover", "router", "chat-completions", "vision"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = [
  "openai>=1.40.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
serve = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
]
dev = ["pytest>=8.0.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/Lrniey666/llm-capability-lab"
Documentation = "https://github.com/Lrniey666/llm-capability-lab#readme"
Repository = "https://github.com/Lrniey666/llm-capability-lab"
Issues = "https://github.com/Lrniey666/llm-capability-lab/issues"
Changelog = "https://github.com/Lrniey666/llm-capability-lab/blob/main/CHANGELOG.md"

[project.scripts]
llmclab = "llmclab.cli:main"

[tool.setuptools.dynamic]
version = {attr = "llmclab.__version__"}

[tool.setuptools.packages.find]
include = ["llmclab*"]
namespaces = false

[tool.setuptools.package-data]
llmclab = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
