# 建出 sdist／wheel、檢查 metadata，並在多個 Python／OS 跑離線測試。不發佈。
name: Package

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -U pip
      - run: python -m pip install ".[serve,dev]"
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tools
        run: python -m pip install -U pip build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check --strict dist/*
      - name: Verify wheel contents
        run: |
          set -euo pipefail
          python -m zipfile -l dist/*.whl
          python -m zipfile -l dist/*.whl | grep -q 'llmclab/py.typed'
          python -m zipfile -l dist/*.whl | grep -q 'llmclab/__init__.py'
      - name: Install outside the repo
        run: |
          set -euo pipefail
          mkdir -p /tmp/clean && cd /tmp/clean
          python -m venv v
          ./v/bin/pip install -U pip
          ./v/bin/pip install "$GITHUB_WORKSPACE"/dist/*.whl
          ./v/bin/python -c "import llmclab; assert 'site-packages' in llmclab.__file__, llmclab.__file__; print(llmclab.__version__)"
          ./v/bin/llmclab keys
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
